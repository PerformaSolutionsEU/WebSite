name: CI

# The deploy workflow only runs on main, which means merging to main IS publishing.
# This is the gate before that: it runs on every PR and on every push to dev, so a
# broken build or a broken link is found while it is still cheap to fix.
on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      # Type-check + a11y hints. Kept blocking: it is green as of the Astro 7
      # migration, and it only stays green if something fails when it is not.
      - name: Check
        run: npm run check

      # Built with the site URL pointed at the local preview server on purpose:
      # canonical and hreflang then resolve against this build instead of against
      # production, so the link check validates the structure without touching the
      # live site — and a brand new page does not fail the check just because its
      # production URL does not exist yet.
      - name: Build
        env:
          PUBLIC_SITE_URL: http://localhost:4321
          PUBLIC_BASE: /
        run: npm run build

      - name: Serve the build
        run: |
          npm run preview &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4321/ -o /dev/null && exit 0
            sleep 1
          done
          echo "preview server did not come up" >&2
          exit 1

      # Pinned to the major, pulled at run time: a link checker is CI-only tooling
      # and does not belong in the dependency tree every developer installs.
      # Exits non-zero on the first broken link.
      - name: Link check
        run: npx --yes linkinator@6 http://localhost:4321 --recurse
